[project]
name = "riser-worker"
version = "0.1.0"
description = "Server-side USD processing for Riser: resolve bindings, validate documents, convert uploads."
requires-python = ">=3.10"
dependencies = [
    # Pixar OpenUSD. The authority on what a Riser layer says.
    "usd-core>=26.5",
]

[project.optional-dependencies]
# The HTTP surface. The core package is importable and testable without it,
# which is why these are not required dependencies.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]
# Format conversion for uploads, via the existing Squarebit converter package.
# Kept optional because it pulls in bpy, which is large.
convert = [
    "sbconversion>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.0",
    "ruff>=0.11",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riser_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
# usd-core ships no type stubs.
[[tool.mypy.overrides]]
module = "pxr.*"
ignore_missing_imports = true
