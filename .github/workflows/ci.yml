name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  # So the full browser suite can be demanded on a branch without opening a PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast gate. Runs on everything, finishes in a couple of minutes, and
  # catches the mistakes that are actually made minute to minute: a type error,
  # a broken unit test, a build that does not compile.
  web:
    name: Web (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The stock assets are generated, and a stale one would make the asset
      # tests pass against something the generator no longer produces.
      - name: Stock assets are up to date
        run: |
          node tools/make-stock-assets.mjs
          git diff --exit-code public/assets

  # The browser suite. CURRENTLY OFF, by request, while the app is being
  # iterated on quickly.
  #
  # "Off" here means it runs only when someone asks for it: Actions -> CI ->
  # Run workflow. The job is intact, so turning it back on is a one line change
  # to this condition, not a rewrite. The line to restore:
  #
  #   if: >-
  #     github.ref == 'refs/heads/main' ||
  #     github.event_name == 'pull_request' ||
  #     github.event_name == 'workflow_dispatch'
  #
  # Why it was worth switching off: it is nineteen minutes against three for
  # everything else put together, and it ran on every push. Why it is worth
  # turning back on before anyone relies on this: it is the only thing here
  # that opens a real renderer, so it is the only thing that catches a
  # regression the unit tests cannot see. Nothing else in this file would have
  # noticed the eyes going black.
  #
  # Not sharded, and deliberately so. Playwright splits a shard by FILE unless
  # `fullyParallel` is on, and the whole suite is one spec file, so a four way
  # matrix put all 62 tests in the first shard and left three runners idle.
  # Turning `fullyParallel` on would make sharding real, but it also lets tests
  # inside a file run out of order, which is a change worth making with the
  # suite actually run against it rather than on the way past.
  e2e:
    name: End-to-end (browser, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  worker:
    name: Worker (OpenUSD contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      # The contract fixture is written by the TypeScript writer and read by
      # OpenUSD. Regenerating it here is the point: it means the Python tests
      # run against what the browser produces TODAY, not against a file that
      # was committed months ago and has silently diverged.
      - name: Regenerate the contract fixture
        run: npx vitest run src/doc/fixture.test.ts

      - name: Install worker dependencies
        run: pip install "usd-core>=26.5" pytest

      - name: Worker tests
        working-directory: worker
        run: python -m pytest tests -q

      - name: Fixture is committed in sync
        run: git diff --exit-code worker/tests/fixtures

  # Publishes riser.squarebitstudios.com, from main and only from main, so
  # what is live is never in question.
  #
  # No longer waits on the browser suite - which is off anyway, and a skipped
  # job in `needs` would block this one. What still has to pass before anything
  # ships: typecheck, the unit tests, the build, the stock assets being in sync
  # and the OpenUSD worker contract. About three minutes.
  deploy:
    name: Deploy to GitHub Pages
    needs: [web, worker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # riser.squarebitstudios.com is served from the repo root today. This
      # workflow replaces that: Pages must be switched to "GitHub Actions" as
      # its source, or this job publishes and nothing changes.
      - name: Keep the custom domain
        run: cp CNAME dist/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
